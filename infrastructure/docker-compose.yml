version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cotizaai-postgres
    restart: always
    environment:
      POSTGRES_USER: cotiza_admin
      POSTGRES_PASSWORD: cotiza_password123
      POSTGRES_DB: cotizaai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotiza_admin -d cotizaai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: cotizaai-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://cotiza_admin:cotiza_password123@db:5432/cotizaai
      JWT_SECRET: cotizaai-super-secret-key-development-2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: cotizaai-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
